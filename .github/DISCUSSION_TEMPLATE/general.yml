# by-dolly
body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/moztopia/moztopia-geolookup/main/logo.png" alt="Moztopia GeoLookup" width="160">

        Discuss the community, contribution process or wider package ecosystem.
        [Community guide](https://github.com/moztopia/moztopia-geolookup/wiki/Community)
  - type: textarea
    id: topic
    attributes:
      label: What would you like to discuss?
      description: Use Q&A for usage help and Ideas for a specific package change.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this matters to the community.
  - type: textarea
    id: question
    attributes:
      label: What input would be useful?
    validations:
      required: true
