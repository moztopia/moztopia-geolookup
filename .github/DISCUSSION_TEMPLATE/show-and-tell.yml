# by-dolly
body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/moztopia/moztopia-geolookup/main/logo.png" alt="Moztopia GeoLookup" width="160">

        Share a community integration, experiment or reusable example.
        [Community guide](https://github.com/moztopia/moztopia-geolookup/wiki/Community)
  - type: textarea
    id: project
    attributes:
      label: What are you building?
      description: Explain the project and the part GeoLookup plays in it.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Public project or demo link
      description: Optional. Share only material you are entitled to make public.
  - type: textarea
    id: lessons
    attributes:
      label: What did you learn?
      description: Useful patterns, limitations or surprises that could help other developers.
  - type: textarea
    id: feedback
    attributes:
      label: What feedback would you like?
